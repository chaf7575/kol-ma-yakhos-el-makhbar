<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مخبرية | تسيير الجرد والتقارير</title>

  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-soft: #eff6ff;
      --secondary: #0f766e;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.10), transparent 30%),
        var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    header {
      padding: 1.5rem 1rem 4.7rem;
      background: linear-gradient(135deg, #172554 0%, #1d4ed8 58%, #0f766e 100%);
      color: #fff;
    }

    .header-content {
      width: min(1180px, calc(100% - 2rem));
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.24);
      font-size: 1.65rem;
    }

    .brand h1 {
      font-size: clamp(1.05rem, 3vw, 1.4rem);
      margin-bottom: 0.25rem;
    }

    .brand p {
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.86rem;
    }

    .today {
      padding: 0.65rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    main {
      width: min(1180px, calc(100% - 2rem));
      margin: -2.8rem auto 0;
      position: relative;
    }

    .section {
      display: none;
      animation: fade 0.25s ease;
    }

    .section.active {
      display: block;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow);
      padding: 1rem;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 1.2rem;
      background: var(--primary-soft);
    }

    .stat-card.success .stat-icon { background: #ecfdf5; }
    .stat-card.warning .stat-icon { background: #fffbeb; }
    .stat-card.danger .stat-icon { background: #fef2f2; }

    .stat-card small {
      display: block;
      color: var(--muted);
      margin-bottom: 0.2rem;
      font-size: 0.78rem;
    }

    .stat-card strong {
      font-size: 1.25rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .panel-title h2 {
      color: var(--primary-dark);
      font-size: 1.06rem;
      margin-bottom: 0.22rem;
    }

    .panel-title p {
      color: var(--muted);
      font-size: 0.83rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.85rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
    }

    .field label {
      color: #334155;
      font-size: 0.82rem;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.72rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 88px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    button {
      font-family: inherit;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.86rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 5px 12px rgba(29, 78, 216, 0.22);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }

    .search-input {
      max-width: 320px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      font-size: 0.86rem;
    }

    th, td {
      padding: 0.82rem 0.7rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      color: #334155;
      background: #f8fafc;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .empty-cell {
      padding: 2rem !important;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.32rem 0.6rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge-good {
      color: #047857;
      background: #d1fae5;
    }

    .badge-medium {
      color: #92400e;
      background: #fef3c7;
    }

    .badge-repair {
      color: #9a3412;
      background: #ffedd5;
    }

    .badge-damaged {
      color: #b91c1c;
      background: #fee2e2;
    }

    .official-report {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      color: #111827;
      padding: 2.5rem;
      border: 1px solid #94a3b8;
      border-radius: 10px;
    }

    .official-header {
      text-align: center;
      line-height: 1.85;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .official-title {
      text-align: center;
      margin: 1.6rem 0;
      font-size: 1.45rem;
      font-weight: 900;
      text-decoration: underline;
    }

    .meta-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.75rem 0;
      border-top: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
      font-weight: 700;
    }

    .report-section-title {
      margin: 1.4rem 0 0.55rem;
      font-weight: 800;
      text-decoration: underline;
    }

    .signatures {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 4rem;
      text-align: center;
      font-weight: 800;
    }

    .signature-line {
      margin-top: 2.7rem;
      border-top: 1px dotted #475569;
      padding-top: 0.35rem;
      font-weight: 400;
      color: #475569;
    }

    nav {
      position: fixed;
      z-index: 1000;
      bottom: 0;
      right: 0;
      left: 0;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.7rem 1rem;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    nav button {
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
    }

    nav button.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    #toast {
      position: fixed;
      z-index: 2000;
      top: 1rem;
      left: 50%;
      transform: translate(-50%, -150%);
      min-width: min(360px, calc(100% - 2rem));
      padding: 0.85rem 1rem;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease;
      font-size: 0.9rem;
    }

    #toast.show {
      transform: translate(-50%, 0);
    }

    @media (max-width: 780px) {
      .header-content {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .official-report {
        padding: 1rem;
        font-size: 0.88rem;
      }

      .signatures {
        font-size: 0.78rem;
      }

      .today {
        display: none;
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 12mm;
      }

      body {
        background: #fff;
        padding: 0;
      }

      header, nav, .no-print, .stats-grid {
        display: none !important;
      }

      main {
        width: 100%;
        margin: 0;
      }

      .section {
        display: none !important;
      }

      .section.active {
        display: block !important;
      }

      .panel {
        padding: 0;
        margin: 0;
        border: none;
        box-shadow: none;
      }

      .official-report {
        width: 100%;
        max-width: none;
        padding: 0;
        border: none;
        border-radius: 0;
      }

      .table-wrap {
        border: none;
      }

      table {
        min-width: 0;
        font-size: 0.72rem;
      }

      th, td {
        border: 1px solid #000 !important;
        padding: 0.38rem;
      }

      textarea {
        border: 1px solid #000;
        border-radius: 0;
        min-height: 60px;
      }
    }
  </style>
</head>

<body>

        <div class="brand-icon">🔬</div>
        <div>
          <h1>منصة تسيير المخبر المتوسط</h1>
          <p>إدارة الجرد والتقرير اليومي بطريقة منظمة وسهلة</p>
        </div>
      </div>
      <div class="today" id="todayLabel"></div>
    </div>
  </header>

  <main>
